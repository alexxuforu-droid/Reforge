# S12.3 — Release pipeline.
#
# Triggered only when a release is actually wanted:
#   - a tag push matching v* (e.g. `git tag v0.1.0 && git push --tags`), or
#   - manual dispatch (Actions tab → "Run workflow").
# Pushes to main do NOT build — every-commit builds used to spawn a 20+ min
# cold compile and a draft release on each push.
#
# Flow: npm ci → typecheck + tests → Rust checks (fmt + clippy + tests) →
# `tauri build` (frontend + release exe + NSIS/MSI bundles) → upload
# everything to a draft GitHub Release. Publishing the draft is a manual step
# so a bad build never ships.
#
# Reforge ships unsigned by decision (docs/DELIVERY.md §1) — there is no
# signing step and no cert secrets to configure.
#
# The updater manifest ({"version","url","sha256","notes"}) is generated and
# attached to the draft release as `latest.json`. The app's
# UpdateConfig.manifest_url points at
# https://github.com/alexxuforu-droid/Reforge/releases/latest/download/latest.json
# (tag-independent, so it keeps working across releases).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# softprops/action-gh-release needs write access to contents (releases) —
# without this the draft step fails with a 403 on repos whose default token
# permissions are read-only.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      # Full history — the updater manifest derives its release notes from
      # `git log` since the previous tag (P4-2); a shallow clone would fall
      # back to a placeholder.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Typecheck + frontend tests
        run: |
          npx tsc --noEmit
          npm test

      # Roadmap P0-5 — the Rust side is gated here too: fmt, clippy with
      # -D warnings, and all unit tests. windows-latest ships MSVC and
      # dtolnay/rust-toolchain defaults to the MSVC host.
      - name: Rust checks (fmt + clippy + tests)
        working-directory: src-tauri
        shell: bash
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      # S12.4 — one build, all artifacts: frontend (beforeBuildCommand),
      # release exe, and the NSIS + MSI installers (bundle.resources ships
      # ffmpeg.exe inside them). S1.2 build identity comes from env vars.
      - name: Tauri build (release exe + NSIS + MSI)
        shell: bash
        env:
          REFORGE_BUILD_TS: ${{ github.event.head_commit.timestamp }}
          REFORGE_GIT_HASH: ${{ github.sha }}
        run: npx tauri build --bundles nsis,msi

      # The raw exe artifact also needs the ffmpeg sidecar next to it (the
      # installer bundles it internally, but a portable exe does not).
      - name: Copy ffmpeg sidecar next to exe
        shell: bash
        run: cp src-tauri/resources/bin/ffmpeg.exe src-tauri/target/release/ffmpeg.exe

      # P4-4 — portable artifact: exe + ffmpeg sidecar in one zip, USB-stick
      # ready (docs/PORTABLE.md explains the workflow).
      - name: Build portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path src-tauri/target/release/reforge.exe, src-tauri/target/release/ffmpeg.exe -DestinationPath Reforge_portable_win_x64.zip -Force

      - name: Generate updater manifest
        id: manifest
        shell: bash
        run: |
          # The manifest url below points at the NSIS -setup.exe bundle, so the
          # sha256 MUST be computed over that same bundle (not the raw
          # reforge.exe) — updater.rs download_update downloads url verbatim
          # and fails verification on any mismatch.
          SETUP="$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -n 1)"
          test -n "$SETUP" && test -f "$SETUP"
          # Version comes from tauri.conf.json (single source of truth) — the
          # exe has no --version CLI, so never try to read it from the binary.
          VERSION="$(python -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"
          SHA256="$(sha256sum "$SETUP" | awk '{print $1}')"
          # Written to the workspace root, NOT /tmp: the release action (Node)
          # resolves /tmp differently than bash on Windows, which silently
          # dropped the manifest from the release.
          python - "$VERSION" "$SHA256" > latest.json <<'EOF'
          import json, subprocess, sys
          version, sha256 = sys.argv[1], sys.argv[2]
          # P4-2 — real release notes: commit subjects since the previous tag
          # (or the last 15 commits on a first release), so the in-app update
          # dialog says what actually changed instead of "Automated release build."
          try:
              prev = subprocess.run(
                  ["git", "describe", "--tags", "--abbrev=0", "HEAD~1"],
                  capture_output=True, text=True, check=False
              ).stdout.strip()
              rng = f"{prev}..HEAD" if prev else "HEAD~15..HEAD"
              log = subprocess.run(
                  ["git", "log", "--oneline", rng],
                  capture_output=True, text=True, check=False
              ).stdout.strip().splitlines()[:20]
              notes = log if log else ["Automated release build."]
          except Exception:
              notes = ["Automated release build."]
          print(json.dumps({
              "version": version,
              # NSIS installer name carries version + arch (e.g. Reforge_0.1.0_x64-setup.exe)
              "url": f"https://github.com/${{ github.repository }}/releases/latest/download/Reforge_{version}_x64-setup.exe",
              "sha256": sha256,
              "notes": notes,
          }, indent=2))
          EOF
          echo "manifest=$(base64 -w0 latest.json)" >> "$GITHUB_OUTPUT"

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          # tag pushes use the tag (e.g. v0.1.0); manual runs fall back to v{run_number}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', github.run_number) }}
          draft: true
          files: |
            src-tauri/target/release/reforge.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
            Reforge_portable_win_x64.zip
            latest.json
          # Fail loudly: a silently-missing artifact used to ship a release
          # without the installer and the update manifest.
          fail_on_unmatched_files: true
