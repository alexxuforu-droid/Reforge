# P4-6 — publish the landing page (site/) to GitHub Pages.
#
# One-time setup (owner, ~30 seconds):
#   Repo → Settings → Pages → Source: "GitHub Actions"
# The page then lives at https://vasilescualex07-droid.github.io/Reforge/
name: pages

on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
